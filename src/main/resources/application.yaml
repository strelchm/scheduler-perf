spring:
  application:
    name: scheduler-perf
  datasource:
    jdbc-url: jdbc:postgresql://postgres-scheduler-perf:5432/schedulers
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml

logging:
  level:
    com.github.kagkarlsson.scheduler: DEBUG

db-scheduler:
  enabled: false
jobrunr:
  background-job-server:
    enabled: false