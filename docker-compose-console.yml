name: scheduler-perf

services:
  scheduler-perf-console:
    build:
      context: ./
      dockerfile: ./comparison/Dockerfile
      args:
        scheduler_type: ${CONSOLE_SCHEDULER_TYPE:-db-scheduler}
    image: "scheduler-perf-console"
    container_name: scheduler-perf-console
    ports:
      - "8081:8080"
      - "8087:8085"
    depends_on:
      postgres-scheduler-perf:
        condition: service_healthy
    restart: always
    environment:
      - SCHEDULER_TYPE=${CONSOLE_SCHEDULER_TYPE:-db-scheduler}

      - MASS_INSERT_ENABLED=${MASS_INSERT_ENABLED:-true}
      - MASS_INSERT_COUNT=${MASS_INSERT_COUNT:-1000}
      - MASS_INSERT_BATCH_SIZE=${MASS_INSERT_BATCH_SIZE:-1000}
      - MASS_INSERT_DELAY_MS=${MASS_INSERT_DELAY_MS:-0}

      - JOB_RUNR_WORKER_COUNT=${JOB_RUNR_WORKER_COUNT:-10}
      - JVM_ARGS=-Xms256m -Xmx512m -XX:+UseG1GC

      - DB_SCHEDULER_THREADS=${DB_SCHEDULER_THREADS:-10}
      - POLL_INTERVAL_IN_SECONDS=${JOB_RUNR_WORKER_COUNT:-5}

      - DB_URL=jdbc:postgresql://postgres-scheduler-perf:5432/schedulers
      - DB_USERNAME=myuser
      - DB_PASSWORD=mypassword
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - scheduler-net

networks:
  scheduler-net:
    name: scheduler-perf_scheduler-net
    external: true
