name: scheduler-perf

services:
  scheduler-perf-spring:
    build:
      context: ./
      dockerfile: ./spring-comparison/Dockerfile
    image: "scheduler-perf-spring"
    container_name: scheduler-perf-spring
    ports:
      - "8080:8080"
      - "8086:8085"
    depends_on:
      postgres-scheduler-perf:
        condition: service_healthy
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_SCHEDULER_TYPE:-db-scheduler-generic}
      - MASS_INSERT_COUNT=${MASS_INSERT_COUNT:-1000}
      - MASS_INSERT_BATCH_SIZE=${MASS_INSERT_BATCH_SIZE:-1000}
      - MASS_INSERT_DELAY_MS=${MASS_INSERT_DELAY_MS:-0}
      - JOB_RUNR_WORKER_COUNT=${JOB_RUNR_WORKER_COUNT:-4}
      - DB_SCHEDULER_THREADS=${DB_SCHEDULER_THREADS:-10}
      - JVM_ARGS=-Xms256m -Xmx512m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - scheduler-net

networks:
  scheduler-net:
    name: scheduler-perf_scheduler-net
    external: true
