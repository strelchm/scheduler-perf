global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'scheduler-perf-app'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /actuator/metrics
    static_configs:
      - targets:
          - scheduler-perf-app:8085

  - job_name: 'scheduler-perf-comparison'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /actuator/metrics
    static_configs:
      - targets:
          - scheduler-perf-comparison:8085

  - job_name: 'postgres-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - postgres-exporter:9187
